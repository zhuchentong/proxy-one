[package]
name = "proxyone"
version = "0.0.4"
edition = "2024"
description = "Lightweight proxy failover gateway: mixed HTTP/SOCKS5 entry that aggregates prioritized upstream proxies with health-checked automatic failover."
repository = "https://github.com/zhuchentong/proxy-one"
license = "MIT OR Apache-2.0"

[dependencies]
anyhow = "1"
chrono = { version = "0.4", default-features = false, features = ["clock"] }
eframe = { version = "0.36", default-features = false, features = ["wgpu", "default_fonts"] }
native-tls = "0.2"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
sha2 = "0.10"
thiserror = "2"
tokio = { version = "1", features = ["rt-multi-thread", "net", "time", "io-util", "sync", "macros", "signal"] }
toml = "1"

[target.'cfg(windows)'.dependencies]
winreg = "0.52"
windows-sys = { version = "0.61", features = ["Win32_Networking_WinInet"] }
tray-icon = "0.25"

# Linux 需要 x11/wayland 窗口后端（winit 默认无后端时报 platform not supported）。
# 渲染器实测必须用 wgpu：glow 在部分 NVIDIA/Windows 组合下整屏空白（2026-09 实测回退）。
# Linux 托盘走 ksni（纯 Rust zbus 的 D-Bus SNI，后端自管工作线程），
# 无需 GTK/libappindicator/libxdo 系统库；ksni 特性自动启用 muda 的
# snapshot 能力（菜单以线程安全快照经 D-Bus 暴露，点击回调同 Windows 路径）。
# 菜单运行于 muda noop 后端：无 GTK 主循环，菜单项状态存于 muda 层。
[target.'cfg(target_os = "linux")'.dependencies]
eframe = { version = "0.36", default-features = false, features = ["x11", "wayland"] }
tray-icon = { version = "0.25", default-features = false, features = ["ksni"] }

# 体积优化：opt-level "z" + fat LTO 实测 13.6MB → 9.8MB（-28%）。
# 刻意不用 panic = "abort"（可再省 ~0.7MB）：tokio 依赖 unwinding 把单条
# 连接任务的 panic 隔离为 JoinError，abort 会把「一个坏连接」放大成
# 「整个网关+GUI 立即退出」，对故障切换网关是错误的取舍。
[profile.release]
opt-level = "z"
lto = true
codegen-units = 1
strip = true
