[package]
name = "proxyone"
version = "0.1.0"
edition = "2024"
description = "Lightweight proxy failover gateway: mixed HTTP/SOCKS5 entry that aggregates prioritized upstream proxies with health-checked automatic failover."
repository = "https://github.com/zhuchentong/proxy-one"
license = "MIT OR Apache-2.0"

[dependencies]
anyhow = "1"
chrono = { version = "0.4", default-features = false, features = ["clock"] }
eframe = { version = "0.36", default-features = false, features = ["wgpu", "default_fonts"] }
egui = "0.36"
native-tls = "0.2"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
sha2 = "0.10"
thiserror = "2"
tokio = { version = "1", features = ["rt-multi-thread", "net", "time", "io-util", "sync", "macros", "signal"] }
toml = "1"

[target.'cfg(windows)'.dependencies]
winreg = "0.52"
windows-sys = { version = "0.61", features = ["Win32_Networking_WinInet"] }
tray-icon = "0.25"

# Linux 需要 x11/wayland 窗口后端（winit 默认无后端时报 platform not supported）；
# 放在 target 段避免这些特性把 glow/glutin 依赖拖进 Windows 构建。
# 托盘在 Linux 运行时降级跳过（platform/tray.rs 单文件形态，原因见该文件头），
# 因此 Linux 侧需要能编译的 tray-icon：关闭默认特性避开 libappindicator/libxdo
# 系统库依赖，用 ksni（纯 Rust zbus 的 D-Bus SNI）+ muda-gtk3（menu 编译后端）
[target.'cfg(target_os = "linux")'.dependencies]
eframe = { version = "0.36", default-features = false, features = ["x11", "wayland"] }
tray-icon = { version = "0.25", default-features = false, features = ["muda-gtk3", "ksni"] }

[profile.release]
lto = "thin"
codegen-units = 1
strip = true
