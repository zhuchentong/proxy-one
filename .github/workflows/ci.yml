name: CI

on:
  push:
    branches: [main]
    tags: ['v*']
  pull_request:

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

env:
  CARGO_TERM_COLOR: always

jobs:
  check:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v5
      - uses: dtolnay/rust-toolchain@stable
        with:
          components: rustfmt, clippy
      - uses: Swatinem/rust-cache@v2
      - run: cargo fmt --all -- --check
      - run: cargo clippy --all-targets -- -D warnings
      - run: cargo test

  build:
    # tag 推送时由 release job 产出二进制，这里跳过避免重复构建
    if: "!startsWith(github.ref, 'refs/tags/v')"
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v5
      - uses: dtolnay/rust-toolchain@stable
      - uses: Swatinem/rust-cache@v2
      - run: cargo build --release
      - uses: actions/upload-artifact@v4
        with:
          name: proxyone-windows-x64
          path: target/release/proxyone.exe

  release:
    if: startsWith(github.ref, 'refs/tags/v')
    needs: check
    runs-on: windows-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v5
      - uses: dtolnay/rust-toolchain@stable
      - uses: Swatinem/rust-cache@v2
      # taiki-e action 只向已存在的 release 上传资产（内部为 gh release upload），
      # 不会自行创建 release，必须先在这里创建并生成说明
      - name: Create release
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        shell: bash
        run: gh release create "$GITHUB_REF_NAME" --verify-tag --generate-notes -R "$GITHUB_REPOSITORY"
      - uses: taiki-e/upload-rust-binary-action@v1
        with:
          bin: proxyone
          target: x86_64-pc-windows-msvc
          include: README.md
          token: ${{ secrets.GITHUB_TOKEN }}
      # 自动更新器下载的裸 exe + 校验和（src/update.rs 按固定文件名筛选）
      - name: Upload raw exe and sha256
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        shell: bash
        run: |
          cd target/x86_64-pc-windows-msvc/release
          sha256sum proxyone.exe > proxyone.exe.sha256
          gh release upload "$GITHUB_REF_NAME" proxyone.exe proxyone.exe.sha256 --clobber -R "$GITHUB_REPOSITORY"
