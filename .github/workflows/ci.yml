name: CI

on:
  push:
    branches: [main]
    tags: ['v*']
  pull_request:

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

env:
  CARGO_TERM_COLOR: always

jobs:
  check:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v5
      - uses: dtolnay/rust-toolchain@stable
        with:
          components: rustfmt, clippy
      - uses: Swatinem/rust-cache@v2
      - run: cargo fmt --all -- --check
      - run: cargo clippy --all-targets -- -D warnings
      - run: cargo test

  build:
    # tag 推送时由 release-* job 产出二进制，这里跳过避免重复构建
    if: "!startsWith(github.ref, 'refs/tags/v')"
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v5
      - uses: dtolnay/rust-toolchain@stable
      - uses: Swatinem/rust-cache@v2
      - run: cargo build --release
      - uses: actions/upload-artifact@v4
        with:
          name: proxyone-windows-x64
          path: target/release/proxyone.exe

  build-linux:
    if: "!startsWith(github.ref, 'refs/tags/v')"
    runs-on: ubuntu-22.04
    steps:
      - uses: actions/checkout@v5
      - uses: dtolnay/rust-toolchain@stable
      - uses: Swatinem/rust-cache@v2
      - name: 安装系统依赖（GTK3/AppIndicator/SSL）
        run: sudo apt-get update && sudo apt-get install -y libgtk-3-dev libayatana-appindicator3-dev pkg-config libssl-dev
      - run: cargo test
      - uses: actions/upload-artifact@v4
        with:
          name: proxyone-linux-x64
          path: target/release/proxyone

  create-release:
    if: startsWith(github.ref, 'refs/tags/v')
    needs: check
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v5
      - env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: gh release create "$GITHUB_REF_NAME" --verify-tag --generate-notes -R "$GITHUB_REPOSITORY"

  release-windows:
    if: startsWith(github.ref, 'refs/tags/v')
    needs: [check, create-release]
    runs-on: windows-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v5
      - uses: dtolnay/rust-toolchain@stable
      - uses: Swatinem/rust-cache@v2
      # taiki-e action 只向已存在的 release 上传资产（内部为 gh release upload），
      # 因此 release 由 create-release job 预先创建
      - uses: taiki-e/upload-rust-binary-action@v1
        with:
          bin: proxyone
          target: x86_64-pc-windows-msvc
          include: README.md
          token: ${{ secrets.GITHUB_TOKEN }}
      # 自动更新器下载的裸 exe + 校验和（src/update.rs 按固定文件名筛选）
      - name: Upload raw exe and sha256
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        shell: bash
        run: |
          cd target/x86_64-pc-windows-msvc/release
          sha256sum proxyone.exe > proxyone.exe.sha256
          gh release upload "$GITHUB_REF_NAME" proxyone.exe proxyone.exe.sha256 --clobber -R "$GITHUB_REPOSITORY"

  release-linux:
    if: startsWith(github.ref, 'refs/tags/v')
    needs: [check, create-release]
    runs-on: ubuntu-22.04
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v5
      - uses: dtolnay/rust-toolchain@stable
      - uses: Swatinem/rust-cache@v2
      - name: 安装系统依赖
        run: sudo apt-get update && sudo apt-get install -y libgtk-3-dev libayatana-appindicator3-dev pkg-config libssl-dev
      - run: cargo build --release
      - name: 打包与校验和
        run: |
          mkdir pack
          cp target/release/proxyone pack/
          cp README.md pack/
          tar -czf proxyone-linux-x64.tar.gz -C pack proxyone README.md
          sha256sum target/release/proxyone > proxyone-linux-x64.sha256
      # 裸二进制 + 校验和供自动更新器下载；tar.gz 供手动下载
      - name: Upload binary, tarball and sha256
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: gh release upload "$GITHUB_REF_NAME" proxyone-linux-x64 proxyone-linux-x64.tar.gz proxyone-linux-x64.sha256 --clobber -R "$GITHUB_REPOSITORY"
